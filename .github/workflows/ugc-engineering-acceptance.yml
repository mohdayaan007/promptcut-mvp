name: UGC isolated engineering acceptance

on:
  push:
    branches: [codex/ugc-editor-48h]
    paths:
      - .github/workflows/ugc-engineering-acceptance.yml
      - scripts/cliponaut-worker.js
      - src/**
      - tests/**
      - package*.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cliponaut, POSTGRES_PASSWORD: cliponaut, POSTGRES_DB: cliponaut_acceptance }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cliponaut -d cliponaut_acceptance" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cliponaut:cliponaut@127.0.0.1:5432/cliponaut_acceptance
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_ACCESS_KEY: S3RVER
      S3_TEST_SECRET_KEY: S3RVER123456789
      GEMINI_API_KEY: synthetic-test-key
      CLIPONAUT_SYNTHETIC_GEMINI_TEST_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v22
        with: { node-version: 22, cache: npm }
      - name: Start disposable MinIO
        run: |
          docker run --detach --rm --name cliponaut-acceptance-minio --publish 9000:9000 \
            --env MINIO_ROOT_USER=S3RVER --env MINIO_ROOT_PASSWORD=S3RVER123456789 \
            minio/minio:RELEASE.2024-10-13T13-34-11Z server /data
          for attempt in $(seq 1 20); do curl --fail --silent http://127.0.0.1:9000/minio/health/live && exit 0; sleep 1; done
          docker logs cliponaut-acceptance-minio
          exit 1
      - run: npm ci
      - name: Run persisted session, storage, worker and synthetic-media acceptance
        env:
          UGC_DIRECTOR_EVIDENCE_DIRECTORY: ${{ runner.temp }}/ugc-director-review
        run: |
          ./node_modules/.bin/tsx --test tests/session-postgres.integration.test.js tests/session-worker-storage.integration.test.js
          ./node_modules/.bin/tsx --test tests/conversation-agent.test.js tests/bounded-editing-agent.test.js tests/ugc-director.test.js tests/ugc-director-media.test.js
      - name: Retain synthetic MP4 evidence briefly
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ugc-synthetic-mp4-${{ github.sha }}
          path: ${{ runner.temp }}/ugc-director-review/
          if-no-files-found: warn
          retention-days: 3
