name: UGC isolated engineering acceptance

on:
  push:
    branches: [codex/ugc-editor-48h]
    paths:
      - .github/workflows/ugc-engineering-acceptance.yml
      - scripts/cliponaut-worker.js
      - src/**
      - tests/**
      - package*.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cliponaut:cliponaut@127.0.0.1:5432/cliponaut_acceptance
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_ACCESS_KEY: S3RVER
      S3_TEST_SECRET_KEY: S3RVER
      GEMINI_API_KEY: synthetic-test-key
      CLIPONAUT_SYNTHETIC_GEMINI_TEST_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Start disposable PostgreSQL
        run: |
          docker run --detach --rm --name cliponaut-acceptance-postgres --publish 5432:5432 \
            --env POSTGRES_USER=cliponaut --env POSTGRES_PASSWORD=cliponaut --env POSTGRES_DB=cliponaut_acceptance \
            postgres:16-alpine
          for attempt in $(seq 1 20); do docker exec cliponaut-acceptance-postgres pg_isready -U cliponaut -d cliponaut_acceptance && exit 0; sleep 1; done
          docker logs cliponaut-acceptance-postgres
          exit 1
      - name: Start disposable S3-compatible storage
        run: |
          npm exec --yes --package=s3rver@3.7.1 -- s3rver --address 127.0.0.1 --port 9000 --directory "$RUNNER_TEMP/s3rver" >"$RUNNER_TEMP/s3rver.log" 2>&1 &
          for attempt in $(seq 1 20); do curl --fail --silent http://127.0.0.1:9000 >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/s3rver.log"
          exit 1
      - name: Install FFmpeg for synthetic media verification
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm ci
      - name: Run persisted session, storage, worker and synthetic-media acceptance
        env:
          UGC_DIRECTOR_EVIDENCE_DIRECTORY: ${{ runner.temp }}/ugc-director-review
          CLIPONAUT_WORKER_DIAGNOSTICS_PATH: ${{ runner.temp }}/ugc-worker-diagnostics.json
        run: |
          set -o pipefail
          ./node_modules/.bin/tsx --test tests/session-postgres.integration.test.js 2>&1 | tee "$RUNNER_TEMP/ugc-acceptance.log"
          ./node_modules/.bin/tsx --test tests/session-worker-storage.integration.test.js 2>&1 | tee -a "$RUNNER_TEMP/ugc-acceptance.log"
          ./node_modules/.bin/tsx --test tests/conversation-agent.test.js tests/bounded-editing-agent.test.js tests/ugc-director.test.js tests/ugc-director-media.test.js 2>&1 | tee -a "$RUNNER_TEMP/ugc-acceptance.log"
      - name: Retain synthetic MP4 evidence briefly
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ugc-synthetic-mp4-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ugc-director-review/
            ${{ runner.temp }}/ugc-acceptance.log
            ${{ runner.temp }}/ugc-worker-diagnostics.json
          if-no-files-found: warn
          retention-days: 3
