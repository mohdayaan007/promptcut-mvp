name: Typography V1A production-container acceptance

on:
  push:
    branches:
      - feature/typography-v1a-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  title-slice:
    name: Validate Typography V1A inside production Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build actual production Dockerfile
        run: docker build --pull --tag cliponaut-typography-v1a:${{ github.sha }} --build-arg NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID=ci-placeholder .
      - name: Run typography and existing editor tests inside deployed image
        run: |
          docker run --rm --entrypoint /bin/sh cliponaut-typography-v1a:${{ github.sha }} -ec '
            cd /app
            ./node_modules/.bin/eslint src/components/cliponaut/TypographyFontBrowser.js src/lib/typography/google-font-catalog.js src/lib/typography/font-recommendations.js src/lib/title-parser.js src/lib/editor-core/typography-v1a.js
            ./node_modules/.bin/tsx --test tests/typography-v1a.test.js tests/google-font-catalog.test.js tests/typography-founder-gate.test.js
            ./node_modules/.bin/tsx --test --test-name-pattern="title typography|ASS title rendering|rich ASS titles|typography reference" tests/jobs.test.js
            ./node_modules/.bin/tsx --test tests/conversation-state.test.js tests/conversation-media.test.js
          '
      - name: Clarify scope
        run: |
          echo "Validated the production Docker build, focused typography/title tests, and timestamp-removal FFmpeg regressions. This is not a hosted render or the full Google Fonts catalogue." >> "$GITHUB_STEP_SUMMARY"
          echo "The complete Linux tests/jobs.test.js suite still has three previously documented FFmpeg pixel-sensitive preset failures (160, 165, 166), reproduced unchanged in run 43866151384. Full suite is not green." >> "$GITHUB_STEP_SUMMARY"
