[phases.setup]
aptPkgs = [
  "ffmpeg",
  "python3",
  "python3-pip"
]

[phases.install]
cmds = [
  "pip3 install --no-cache-dir openai-whisper",
  "pip3 install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "npm run start"
